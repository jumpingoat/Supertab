<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>SuperTab – Opcje</title>
<style>
  /* [FIX M1] Usunięto Google Fonts — external @import łamałby CSP extension_pages style-src 'self'
     Używamy systemowego font stack zamiast DM Sans */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #5b4fff;
    --accent-soft: #ede9ff;
    --bg: #f8f7f5;
    --surface: #fff;
    --border: #e8e5e0;
    --text: #1a1a1a;
    --muted: #888;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 32px;
    width: 380px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 28px; }

  .section { margin-bottom: 28px; }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 500; }
  .field .hint { font-size: 11px; color: var(--muted); }

  .color-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  input[type=color] {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    padding: 2px;
    cursor: pointer;
    background: none;
  }
  .color-presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
  }
  .preset:hover { transform: scale(1.15); }
  .preset.selected { border-color: var(--text); }

  .save-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  button.save {
    padding: 10px 24px;
    border-radius: 50px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button.save:hover { opacity: .85; }
  .saved-msg { font-size: 12px; color: #22c55e; display: none; }
  .saved-msg.show { display: inline; }
</style>
</head>
<body>
<div class="card">
  <h1>SuperTab – Opcje</h1>
  <p class="subtitle">Ustawienia wtyczki</p>

  <div class="section">
    <div class="section-title">Kolor podświetlenia zakładek</div>
    <p class="hint" style="font-size:11px;color:#888;margin-bottom:12px;">
      Dwuklik na zakładce zaznacza ją ramką w wybranym kolorze.
    </p>
    <div class="field">
      <label>Kolor ramki</label>
      <div class="color-row">
        <input type="color" id="highlightColor" value="#f59e0b">
        <div class="color-presets" id="presets"></div>
      </div>
    </div>
  </div>

  <div class="save-row">
    <button class="save" id="saveBtn">Zapisz</button>
    <span class="saved-msg" id="savedMsg">Zapisano!</span>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
