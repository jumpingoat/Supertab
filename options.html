<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>SuperTab – Opcje</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<div class="card">
  <h1>SuperTab – Opcje</h1>
  <p class="subtitle">Ustawienia wtyczki</p>

  <div class="section">
    <div class="section-title">Kolor podświetlenia zakładek</div>
    <p class="hint hint-spaced">
      Dwuklik na zakładce zaznacza ją ramką w wybranym kolorze.
    </p>
    <div class="field">
      <label>Kolor ramki</label>
      <div class="color-row">
        <input type="color" id="highlightColor" value="#f59e0b">
        <div class="color-presets" id="presets"></div>
      </div>
    </div>
  </div>

  <div class="save-row">
    <button class="save" id="saveBtn">Zapisz</button>
    <span class="saved-msg" id="savedMsg">Zapisano!</span>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
